<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PowerFit - Workout & Cardio Tracker</title>
  
  <!-- Configurações PWA e Tema -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#fd7e14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <link rel="stylesheet" href="styles.css">
  
  <!-- Biblioteca para exportar o Card de Compartilhamento -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

  <!-- CABEÇALHO E DASHBOARD -->
  <header>
    <h1>POWER<span>FIT</span></h1>
    <div id="dashboard">
      <p id="weekly-progress">Treinos concluídos na semana: 0</p>
      <p id="last-workout">Último treino: nenhum</p>
    </div>
  </header>

  <!-- NAVEGAÇÃO POR ABAS -->
  <nav class="tabs">
    <button id="btn-tab-A" class="active" onclick="switchWorkout('A')">Treino A</button>
    <button id="btn-tab-B" onclick="switchWorkout('B')">Treino B</button>
    <button id="btn-tab-C" onclick="switchWorkout('C')">Treino C</button>
    <button id="btn-tab-Cardio" onclick="switchWorkout('Cardio')">Cardio 🏃‍♂️</button>
    <button id="btn-tab-Hist" onclick="renderHistory()">Histórico 📜</button>
  </nav>

  <!-- BANNER DO TIMER DE DESCANSO AUTOMÁTICO -->
  <div id="rest-timer-banner" style="display: none;">
    <span>Descanso: <strong id="timer-countdown">60s</strong></span>
    <button onclick="skipTimer()">Pular ⏭</button>
  </div>

  <!-- CONTEÚDO PRINCIPAL -->
  <main>
    <div id="progress">Progresso: 0% concluído</div>

    <!-- LISTA DE EXERCÍCIOS (TREINOS A, B, C) -->
    <div id="exercise-list"></div>

    <!-- PAINEL DE CARDIO E GPS -->
    <div id="cardio-panel" style="display: none;">
      <div class="cardio-metrics">
        <div class="metric-box">
          <span class="metric-label">Distância</span>
          <span class="metric-value"><strong id="cardio-distance">0.00</strong> <small>km</small></span>
        </div>
        <div class="metric-box">
          <span class="metric-label">Tempo</span>
          <span class="metric-value" id="cardio-duration">00:00</span>
        </div>
        <div class="metric-box">
          <span class="metric-label">Velocidade</span>
          <span class="metric-value"><strong id="cardio-speed">0.0</strong> <small>km/h</small></span>
        </div>
        <div class="metric-box">
          <span class="metric-label">Passos</span>
          <span class="metric-value" id="cardio-steps">0</span>
        </div>
        <div class="metric-box">
          <span class="metric-label">Calorias</span>
          <span class="metric-value"><strong id="cardio-calories">0</strong> <small>kcal</small></span>
        </div>
      </div>

      <!-- DESENHO DO RASTREIO NO MAPA -->
      <div class="canvas-container">
        <canvas id="cardio-route-canvas" width="300" height="200"></canvas>
      </div>

      <button id="btn-toggle-cardio" class="main-btn cardio-btn" onclick="toggleCardioTracking()">
        ▶ Iniciar Atividade
      </button>
    </div>

    <!-- HISTÓRICO DE TREINOS -->
    <div id="history-list" style="display: none;"></div>

    <div id="output" style="display: none;"></div>
  </main>

  <!-- BOTÕES DE AÇÃO -->
  <div class="buttons-group">
    <button id="btn-add" class="main" onclick="addExercise()">➕ Adicionar Exercício</button>
    <button class="main" onclick="generateWorkout()">🔥 Concluir Treino</button>
    <button class="secondary" onclick="shareActivity()">📸 Compartilhar</button>
    <button class="danger" onclick="confirmReset()">🔄 Redefinir</button>
  </div>

  <!-- CARD OCULTO PARA GERAR A IMAGEM DO INSTAGRAM -->
  <div id="share-card-wrapper" style="position: absolute; left: -9999px; top: -9999px;">
    <div id="instagram-share-card" class="share-card-theme">
      <div class="share-header">
        <h2>POWER<span>FIT</span></h2>
        <span id="share-card-date">00/00/0000</span>
      </div>
      
      <h3 id="share-workout-title">TREINO A</h3>
      
      <div id="share-map-container" style="display: none;">
        <canvas id="share-route-canvas" width="280" height="150"></canvas>
      </div>

      <div class="share-stats">
        <div class="stat-item">
          <span id="share-stat-exercises" class="stat-num">0</span>
          <span id="share-lbl-exercises" class="stat-desc">Exercícios</span>
        </div>
        <div class="stat-item">
          <span id="share-stat-progress" class="stat-num">100%</span>
          <span id="share-lbl-progress" class="stat-desc">Progresso</span>
        </div>
      </div>

      <div class="share-footer">
        <p>Treino Pago! 💪🔥</p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
